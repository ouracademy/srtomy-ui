version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Held back until the ecosystem catches up (see PR "upgrade dependencies"):
      # @mui/x-* 8.x supports MUI <= 7, typescript-eslint supports TS < 6.1,
      # eslint plugins do not declare ESLint 10.
      - dependency-name: "@mui/*"
        update-types: [version-update:semver-major]
      - dependency-name: react-hook-form-mui
        update-types: [version-update:semver-major]
      - dependency-name: mui-tel-input
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
