name: ci

on:
  # Only main (post-merge) triggers on push; a branch with an open PR is
  # already covered by `pull_request`, so triggering on both doubled every run.
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches .nvmrc.
  NODE_VERSION: "22"

jobs:
  # A pull request that only changes docs (*.md, docs/) runs the commit and docs checks and skips
  # the rest (scripts/only-docs-changed.sh); a skipped job counts as passed for a required check.
  # A push to main always runs everything.
  changes:
    name: qué cambió
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ] && bash scripts/only-docs-changed.sh "$BASE"; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  docs:
    name: documentación (formato, referencias)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: formato
        run: pnpm format:check
      - name: lo que nombran los docs existe; sin frases repetidas
        run: pnpm check:docs

  commits:
    name: commits (conventional)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: validar mensajes de commit
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  verify:
    name: tipos, lint, formato
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The tools run directly (not through the pnpm scripts) because those
      # re-run `pnpm api:generate`, which `pnpm install` already ran in
      # postinstall.
      - name: tipos
        run: pnpm exec tsc --noEmit
      - name: lint
        run: pnpm exec eslint .
      # dependency-cruiser (.dependency-cruiser.cjs): the rules of
      # docs/architecture.md. Known violations live in
      # .dependency-cruiser-known-violations.json; only new ones fail. Same
      # command as the Claude Code Stop hook.
      - name: arquitectura
        run: pnpm check:arch
      # Every Playwright test has exactly one level: @smoke, @story or @journey.
      - name: niveles de las pruebas
        run: pnpm check:tests
      - name: formato
        run: pnpm format:check

  # Separate job so it runs in parallel with the static checks. It replaces
  # the unit tests of `pnpm check`, so they run once, with coverage.
  test:
    name: pruebas unitarias y cobertura (umbral 80%)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: vitest con cobertura
        run: pnpm exec vitest run --coverage

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Incremental builds: reuse Next's compiler cache across runs.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'public/**', 'next.config.js') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      # Fake values, same as playwright.config.ts: the build never reaches
      # Auth0 or the backend.
      - name: next build
        run: pnpm build
        env:
          NEXT_PUBLIC_AUTH0_DOMAIN: test.auth0.local
          NEXT_PUBLIC_AUTH0_CLIENT_ID: ci-client
          NEXT_PUBLIC_API_URL: http://localhost:8080

  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # No install: audit only reads pnpm-lock.yaml.
      - name: dependencias de producción
        run: pnpm audit --prod

  # The slowest level of the test pyramid (the `test-pyramid` skill) runs last, and only once the
  # static checks, the unit and component tests and the build passed: a failure there stops the run
  # before the browser starts. Inside, smoke, then stories, then journeys, each step only if the one
  # before passed.
  e2e:
    name: e2e (smoke, story, journey)
    needs: [verify, test, build]
    # Forks get no secrets, so e2e runs only for pushes and PRs from this repo.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    environment: dev
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only chromium runs in CI.
      - name: versión de Playwright
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: caché de los navegadores
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: instalar Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      # The browser is cached, but the OS libraries it needs are not.
      - name: dependencias del sistema de Chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: e2e @smoke
        run: pnpm exec playwright test --project=chromium --grep @smoke
      - name: e2e @story
        run: pnpm exec playwright test --project=chromium --grep @story
      - name: e2e @journey
        run: pnpm exec playwright test --project=chromium --grep @journey
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
